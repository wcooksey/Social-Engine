<aside class="sidebar" [class.mobile-open]="mobileMenuService.isOpen()">
  <div class="sidebar-header">
    <a class="logo" routerLink="/dashboard" (click)="handleNavClick()">
      <img class="logo-icon" src="assets/brand/neuralnetics-mark-256.png" alt="">
      <span class="logo-text">Neuralnetics</span>
    </a>
  </div>

  <nav class="top-nav">
    <a
      *ngFor="let item of navItems(); trackBy: trackByRoute"
      [routerLink]="item.route"
      routerLinkActive="active"
      class="top-nav-item"
      (click)="handleNavClick()">
      <i [class]="'bi ' + item.icon" class="nav-icon"></i>
      <span class="nav-label">{{ item.label }}</span>
    </a>
  </nav>

  <div class="sidebar-spacer"></div>

  <div class="sidebar-footer">
    <div class="footer-actions">
      <button class="logout-btn" *ngIf="currentUser() as user" (click)="logout()" title="Log out">
        <i class="bi bi-box-arrow-right"></i>
        <span>Logout</span>
      </button>
      <app-theme-toggle></app-theme-toggle>
    </div>
  </div>
</aside>
