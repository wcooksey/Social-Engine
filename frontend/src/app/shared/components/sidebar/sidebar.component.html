<aside class="sidebar" [class.mobile-open]="mobileMenuService.isOpen()">
  <div class="sidebar-header">
    <a class="logo" routerLink="/groups" (click)="handleNavClick()">
      <img class="logo-icon" src="assets/brand/neuralnetics-mark-256.png" alt="">
      <span class="logo-text">Neuralnetics</span>
    </a>
  </div>

  <div class="sidebar-navigation">
  <nav class="top-nav" aria-label="Workspace">
    <a
      *ngFor="let item of navItems(); trackBy: trackByRoute"
      [routerLink]="item.route"
      routerLinkActive="active" [routerLinkActiveOptions]="{ exact: !item.route.endsWith('/outreach') }"
      class="top-nav-item"
      (click)="handleNavClick()">
      <i [class]="'bi ' + item.icon" class="nav-icon"></i>
      <span class="nav-label">{{ item.label }}</span>
    </a>
  </nav>

  <a class="top-nav-item" routerLink="/crm" (click)="handleNavClick()" *ngIf="currentUser()?.role === 'OWNER' || currentUser()?.role === 'ADMIN'"><i class="bi bi-telephone nav-icon"></i><span>Calling CRM</span></a>
  <details class="global-tools">
    <summary class="top-nav-item"><i class="bi bi-grid nav-icon" aria-hidden="true"></i><span class="nav-label">Global tools</span><i class="bi bi-chevron-down expand-arrow" aria-hidden="true"></i><i class="bi bi-chevron-up collapse-arrow" aria-hidden="true"></i></summary>
    <nav class="top-nav" aria-label="Global tools">
      <a *ngFor="let item of operations()" [routerLink]="item.route" routerLinkActive="active" class="top-nav-item" (click)="handleNavClick()"><i [class]="'bi ' + item.icon" class="nav-icon" aria-hidden="true"></i><span class="nav-label">{{ item.label }}</span></a>
    </nav>
  </details>
  </div>

  <div class="sidebar-footer">
    <div class="footer-actions">
      <button class="logout-btn" *ngIf="currentUser() as user" (click)="logout()" title="Log out">
        <i class="bi bi-box-arrow-right"></i>
        <span>Logout</span>
      </button>
      <app-theme-toggle></app-theme-toggle>
    </div>
  </div>
</aside>
