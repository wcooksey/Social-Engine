@if (link !== null) {
  <a [routerLink]="disabled || loading ? null : link" [queryParams]="queryParams" [fragment]="fragment"
    [attr.aria-disabled]="disabled || loading ? true : null" [attr.tabindex]="disabled || loading ? -1 : null"
    [class]="getButtonClasses()" (click)="onClick($event)"><ng-container *ngTemplateOutlet="content" /></a>
} @else {
  <button [type]="type" [disabled]="disabled || loading" [class]="getButtonClasses()" (click)="onClick($event)"><ng-container *ngTemplateOutlet="content" /></button>
}
<ng-template #content>
  @if (loading) {
    <span class="button__spinner"></span>
  }
  @if ((icon || customIcon) && iconPosition === 'left' && !loading) {
    @if (customIcon) {
      <span class="button__icon button__icon--left" [innerHTML]="safeCustomIcon"></span>
    } @else if (icon) {
      <i [class]="'bi ' + icon" class="button__icon button__icon--left"></i>
    }
  }
  <span class="button__content">
    <ng-content></ng-content>
  </span>
  @if ((icon || customIcon) && iconPosition === 'right' && !loading) {
    @if (customIcon) {
      <span class="button__icon button__icon--right" [innerHTML]="safeCustomIcon"></span>
    } @else if (icon) {
      <i [class]="'bi ' + icon" class="button__icon button__icon--right"></i>
    }
  }
</ng-template>
