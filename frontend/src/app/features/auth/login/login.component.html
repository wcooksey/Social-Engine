<div class="auth-page">
  <div class="auth-content">
    <div class="auth-branding">
      <img class="brand-icon" src="assets/brand/neuralnetics-mark-256.png" alt="">
      <span class="brand-text">Neuralnetics</span>
    </div>

    <h1 *ngIf="callerLogin">Calling CRM</h1>
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="auth-form">
      @if (error) {
        <div class="auth-error">{{ error }}</div>
      }

      <input
        type="email"
        placeholder="Email"
        aria-label="Email"
        autocomplete="username"
        formControlName="email"
        class="auth-input"
        [class.input-error]="emailError"
        required>
      @if (emailError) {
        <span class="field-error">{{ emailError }}</span>
      }

      <input
        type="password"
        placeholder="Password"
        aria-label="Password"
        autocomplete="current-password"
        formControlName="password"
        class="auth-input"
        [class.input-error]="passwordError"
        required>
      @if (passwordError) {
        <span class="field-error">{{ passwordError }}</span>
      }

      <app-button
        type="submit"
        variant="primary"
        [fullWidth]="true"
        [disabled]="loginForm.invalid"
        [loading]="isLoading">
        Sign In
      </app-button>

      <p *ngIf="callerLogin">Use the login created from your group invitation.</p>
      <a *ngIf="!callerLogin" routerLink="/register" class="switch-link">Don't have an account? Create one</a>
    </form>
  </div>
</div>
