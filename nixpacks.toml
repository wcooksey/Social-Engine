[phases.setup]
# chromium: the Engine's browser tools (browse_web / send_social_dm) drive a
# real browser via Playwright — without it every browser step fails at launch.
nixPkgs = ["nodejs_20", "chromium"]

[phases.install]
cmds = ["npm run install:all"]

[phases.build]
cmds = ["cd backend && npx prisma generate", "npm run build:frontend", "cd backend && npm run build"]

[start]
cmd = "cd backend && npx prisma migrate deploy && npm start"
